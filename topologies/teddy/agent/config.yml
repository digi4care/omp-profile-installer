# Portable OMP agent overlay — NOT a replacement for the user's full config.
# Only overrides are listed here. See ~/.omp config for providers, secrets,
# and everything else.

task:
  eager: always        # spawn subagents immediately when slices are ready
  autoParallel: on     # parallelize independent slices automatically
  maxConcurrency: 4    # cap on concurrent subagents
  maxRecursionDepth: 2 # bound main orchestrator -> domain lead -> leaf worker
  isolation:
    # Isolation only applies to Git worktrees, and only when an assignment
    # explicitly requests isolated work — not a default for every task.
    enabled: true
    merge: patch       # integrate isolated work as a patch, not a branch merge

# NOTE: model route availability differs per provider/machine; adjust the
# routes below when applying this overlay on another machine.

modelRoles:
  task: openai-codex/gpt-6-luna:high
  engineering-model: kimi-code/kimi-for-coding:high
  qa-model: openai-codex/gpt-6-luna:high
  design-model: openai-codex/gpt-6-luna:high
