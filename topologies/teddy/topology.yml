# Topology metadata for the omp-topology installer.
name: teddy
version: 1.0.0
description: >-
  Six-domain digital product studio with Teddy-derived planning practices:
  the main session routes work across product-strategy, engineering, QA,
  design, content, and marketing domain leads, each backed by a lazy charter
  skill. Product Strategy challenges premises and separates strategic
  requirements from Engineering's technical architecture plan; Engineering
  plans architecture conditionally (as-built inspection, option trade-offs,
  requirements-to-verification traceability); QA reviews architecture plans
  for requirement-acceptance-verification traceability before build.
  Subagent spawning is bounded by task.maxRecursionDepth 2.
installable: true
