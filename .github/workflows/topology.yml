# Topology contract checks for pull requests that change topologies/**.
#
# The single `topology` job runs for every pull request so branch protection
# can require the one stable check name `topology`; the topology gates
# execute only when the PR changes files under topologies/<slug>/. A PR with
# no topology change passes with an explicit notice and does NOT imply that
# topology validation ran.
#
# For each changed topology slug the job:
#   1. Fails when topology payload files exist without a valid manifest:
#      topologies/<slug>/topology.yml must parse, set installable: true, and
#      set name to the slug, so the installer lists it. A topology removed
#      wholesale in the PR is skipped.
#   2. Confirms `cargo run --locked -- list --json` shows the exact
#      name/version/description declared in topology.yml. The manifest is
#      parsed with Ruby's stdlib YAML (preinstalled on the runner; no new
#      dependencies); the comparison mirrors src/value.rs display_metadata.
#   3. Runs the installer contract suite once per job (the suite is
#      topology-independent): cargo test --locked --test installer.
#   4. Dry-runs the install into a fresh temporary agent directory:
#      cargo run --locked -- install -t <slug> --dry-run --agent-dir <tmp>/agent
#      The /agent basename keeps the default registry alias valid
#      ([a-z0-9][a-z0-9-]{0,63}); a bare mktemp basename is rejected.
name: Topology

on:
  pull_request:

permissions:
  contents: read

jobs:
  topology:
    # Stable check name for branch protection: require `topology`.
    name: topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Detect changed topology slugs
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          slugs="$(
            git diff --name-only "$BASE_SHA...$HEAD_SHA" \
              | sed -n 's|^topologies/\([^/][^/]*\)/.*|\1|p' \
              | sort -u
          )"
          if [ -z "$slugs" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "slugs<<SLUGS_EOF"
              printf '%s\n' "$slugs"
              echo "SLUGS_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changed topologies
        if: steps.detect.outputs.changed == 'true'
        env:
          SLUGS: ${{ steps.detect.outputs.slugs }}
        run: |
          set -eu
          # `list` is the installer's own manifest gate: it reports only
          # topologies whose topology.yml parses, sets installable: true,
          # and has a non-empty name.
          cargo run --locked -- list --json > "$RUNNER_TEMP/topologies.json"

          printf '%s\n' "$SLUGS" | while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            manifest="topologies/$slug/topology.yml"
            if [ ! -f "$manifest" ]; then
              if [ -d "topologies/$slug" ]; then
                echo "::error::topologies/$slug has payload files but no topology.yml manifest" >&2
                exit 1
              fi
              echo "topology '$slug' was removed in this PR; nothing to validate"
              continue
            fi
            ruby -ryaml -rjson -e '
              slug, manifest_path, list_path = ARGV
              fail = lambda do |message|
                puts "::error::#{message}"
                exit 1
              end
              begin
                manifest = YAML.safe_load(File.read(manifest_path))
              rescue Psych::Exception => e
                fail.call("#{manifest_path} does not parse as YAML: #{e.message}")
              end
              fail.call("#{manifest_path} must be a YAML mapping") unless manifest.is_a?(Hash)

              # Mirror src/value.rs display_metadata: nil -> "", booleans ->
              # True/False, integral floats -> one decimal, sequences joined
              # with ", ", maps -> "". Non-integral floats must render like
              # Rust f64 Display: shortest round-trip digits in plain
              # decimal, never scientific notation. Ruby Float#to_s
              # switches to exponential form (0.00001 -> 1.0e-05), so
              # re-expand it to the plain decimal Rust prints.
              plain_float = lambda do |value|
                text = value.to_s
                match = /\A(-?)(\d)\.(\d+)e([+-]?\d+)\z/.match(text)
                next text unless match
                sign = match[1]
                digits = (match[2] + match[3]).sub(/0+\z/, "")
                point = 1 + match[4].to_i
                if point <= 0
                  "#{sign}0.#{'0' * -point}#{digits}"
                elsif point >= digits.length
                  "#{sign}#{digits}#{'0' * (point - digits.length)}"
                else
                  "#{sign}#{digits[0, point]}.#{digits[point..]}"
                end
              end
              render = lambda do |value|
                case value
                when nil then ""
                when true then "True"
                when false then "False"
                when Float then value == value.truncate ? format("%.1f", value) : plain_float.call(value)
                when Array then value.map { |item| render.call(item) }.join(", ")
                when Hash then ""
                else value.to_s
                end
              end

              expected = %w[name version description].to_h { |key| [key, render.call(manifest[key])] }
              unless expected["name"] == slug
                fail.call("manifest name #{expected["name"].inspect} does not match directory slug #{slug.inspect}")
              end

              entries = JSON.parse(File.read(list_path)).fetch("topologies", [])
              entry = entries.find { |item| item["name"] == slug }
              if entry.nil?
                fail.call("list does not show #{slug.inspect}: topology.yml must parse, set installable: true, and set name to the slug")
              end
              %w[version description].each do |key|
                actual = render.call(entry[key])
                unless actual == expected[key]
                  fail.call("list #{key} mismatch for #{slug.inspect}: manifest declares #{expected[key].inspect}, list shows #{actual.inspect}")
                end
              end
              puts "topology #{slug.inspect}: list shows the exact name/version/description from topology.yml"
            ' "$slug" "$manifest" "$RUNNER_TEMP/topologies.json"
          done

          # The installer contract suite is topology-independent; run it
          # once whenever at least one topology changed.
          cargo test --locked --test installer

          printf '%s\n' "$SLUGS" | while IFS= read -r slug; do
            [ -n "$slug" ] || continue
            [ -f "topologies/$slug/topology.yml" ] || continue
            target="$(mktemp -d)/agent"
            echo "dry-run: installing topology '$slug' into '$target'"
            cargo run --locked -- install -t "$slug" --dry-run --agent-dir "$target"
          done

      - name: Report skipped topology checks
        if: steps.detect.outputs.changed == 'false'
        run: echo "No files under topologies/<slug>/ changed; topology checks did not run."
