# Runs the pinned Rust quality gates only when a pull request changes Rust inputs.
# The same entry point is scripts/rust-gates.sh; keep them in sync.
name: Rust gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Rust-affecting changes
        id: rust_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)Cargo\.(toml|lock)$|(^|/)rust-toolchain(\.toml)?$|(^|/)\.cargo/|\.rs$|^scripts/rust-gates\.sh$|^\.github/workflows/rust-gates\.yml$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pinned Docker gate script
        if: steps.rust_changes.outputs.rust == 'true'
        run: scripts/rust-gates.sh
